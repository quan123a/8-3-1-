<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chúc mừng 8/3 - Hộp quà yêu thương</title>
  <link rel="stylesheet" href="8-3.css" />
</head>
<body>
  <div class="overlay" aria-hidden="true"></div>

  <main class="container">
    <header class="hero card fade-float">
      <h1 id="heroTitle">🌸 Chúc mừng ngày Quốc tế Phụ nữ 8/3 🌸</h1>
      <p id="heroSubtitle" class="typed-text"></p>
    </header>

    <section class="gift-grid" aria-label="Bốn hộp quà 8/3">
      <button class="gift-box box-1" id="gift1">🎁 Hộp quà 1<br /><span>Lời chúc dài</span></button>
      <button class="gift-box box-2" id="gift2">💝 Hộp quà 2<br /><span>Mưa tim vô hạn</span></button>
      <button class="gift-box box-3" id="gift3">🖼️ Hộp quà 3<br /><span>Kho ảnh trái tim</span></button>
      <button class="gift-box box-4" id="gift4">✨ Hộp quà 4<br /><span>Cá nhân hoá tên</span></button>
    </section>

    <section class="card output" id="output">
      <h2>Khu vực bất ngờ</h2>
      <p class="hint">Hãy bấm một hộp quà để mở hiệu ứng nhé 💐</p>
      <div id="dynamicContent"></div>
      <div id="rainLayer" aria-hidden="true"></div>
    </section>
  </main>

  <dialog id="nameDialog" class="name-dialog">
    <form method="dialog" id="nameForm" class="dialog-content">
      <h3>Nhập tên người bạn muốn gửi lời chúc</h3>
      <input id="nameInput" type="text" placeholder="Ví dụ: Linh" maxlength="30" required />
      <div class="dialog-actions">
        <button value="cancel" class="btn secondary">Hủy</button>
        <button value="ok" class="btn primary">Gửi lời chúc</button>
      </div>
    </form>
  </dialog>

  <script src="8-3.js"></script>
</body>
</html>
